<header class="md:w-2/3 md:mx-auto md:px-8 flex flex-col sm:flex-row">
  <h1 class="text-3xl text-center">
    <a href="{{ page.url }}">{{ page.title }}</a> <small>{{ page.subtitle }}</small>
  </h1>
  <div class="text-center mt-4 sm:my-auto">
    {% if page.lang == 'fr' %}Français{% else %}<a href="/">Français</a>{% endif %}
    |
    {% if page.lang == 'en' %}English{% else %}<a href="/en/">English</a>{% endif %}
  </div>
</header>

<nav class="md:w-2/3 md:mx-auto pb-4 text-center">
  {% for entry in page.menus %}
  <a href="{{ entry.href }}">{{ entry.text }}</a>
  <span class="mx-2" aria-hidden="true">&middot;</span>
  {% endfor %}
  <span>
    {% include flickr.svg %}
    <a href="https://www.flickr.com/people/bebatut/">Flickr</a>
  </span>
</nav>
